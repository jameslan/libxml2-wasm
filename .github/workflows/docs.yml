name: Doc Site Build
on:
  push:
    branches:
      - master
  release:
    types: [published]
jobs:
  build:
    name: Build Doc
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Find variables
        id: vars
        # version: if on master branch push, use "dev", otherwise major.minor
        # full_version: without the leading "v", only meaningful for a release
        run: |
          [ "$GITHUB_REF_NAME" = "master" ] && (echo version=dev >> $GITHUB_OUTPUT) || (echo version=$GITHUB_REF_NAME | cut -d "." -f 1,2 >> $GITHUB_OUTPUT)
          echo "full_version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          echo git_msg=\"$(git log -1 --pretty=format:'%s')\" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Install npm packages
        run: npm ci
      - name: Build the document
        run: npm run doc -- --gitRevision $GITHUB_REF_NAME
      - name: Checkout the site
        uses: actions/checkout@v6
        with:
          path: site
          ref: gh-pages
      - name: build site
        run: |
          rm -rf site/${{ steps.vars.outputs.version }}
          mv _site site/${{ steps.vars.outputs.version }}
      - name: Update versions.json
        # Only releases change the version list, "dev" is always there
        if: github.event_name == 'release'
        env:
          DIR: ${{ steps.vars.outputs.version }}
          VERSION: ${{ steps.vars.outputs.full_version }}
        run: |
          jq --arg dir "$DIR" --arg version "$VERSION" '
            def vkey: .version | split(".") | map(tonumber);
            [{dir: $dir, version: $version, url: "https://jameslan.github.io/libxml2-wasm/\($dir)/"}]
            + map(select(.dir != $dir and .dir != "dev"))
            | sort_by(vkey) | reverse
            | . + [{dir: "dev", version: "dev", url: "https://jameslan.github.io/libxml2-wasm/dev/"}]
          ' site/versions.json > versions.json.tmp
          mv versions.json.tmp site/versions.json
      - name: Commit to site branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          repository: site
          branch: gh-pages
          commit_message: Doc of version ${{ steps.vars.outputs.version }} generated from ${{ steps.vars.outputs.sha_short }} ${{ steps.vars.outputs.git_msg }}
          skip_dirty_check: false
          skip_fetch: true
          skip_checkout: true
